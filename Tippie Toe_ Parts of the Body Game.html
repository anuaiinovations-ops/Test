<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tippie Toe: Parts of the Body</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#7dd3fc;--sky2:#fef9c3;--card:#fff;--ink:#312e81;--pink:#ff4fa3;--blue:#2d9cff;--green:#2ecc71;--yellow:#ffcf1f;--orange:#ff8a1f;--purple:#8b5cf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1e1b4b;--sky2:#4c1d95;--card:#2e2a5e;--ink:#fff}}
:root[data-theme="dark"]{--sky1:#1e1b4b;--sky2:#4c1d95;--card:#2e2a5e;--ink:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Fredoka','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;font-weight:500;color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2));overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.bg b{position:absolute;font-size:44px;animation:fl 7s ease-in-out infinite;opacity:.85}
@keyframes fl{50%{transform:translateY(-26px) rotate(10deg)}}
#app{position:relative;max-width:760px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo{height:64px;border-radius:18px;background:#fff;padding:2px;box-shadow:0 4px 0 #0002}
.hud{display:flex;gap:6px;flex-wrap:wrap}.hud span{background:var(--card);border-radius:20px;padding:6px 12px;font-size:19px;font-weight:700;box-shadow:0 4px 0 #0002}
.bar{height:16px;border-radius:10px;background:#fff8;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--green));border-radius:10px;transition:width .5s}
.mas{display:flex;align-items:center;gap:10px;margin:8px 0}.mas img{width:104px;height:150px;object-fit:cover;object-position:top;border-radius:60px 60px 24px 24px;border:5px solid #fff;box-shadow:0 6px 0 #0003;animation:bob 1.6s ease-in-out infinite;flex:none}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.bub{background:var(--card);border-radius:24px;padding:12px 16px;font-size:20px;position:relative;box-shadow:0 4px 0 #0002}
.bub:before{content:"";position:absolute;left:-14px;top:40%;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.title{text-align:center;font-size:clamp(34px,9vw,58px);margin:6px 0 14px;line-height:1}
.title span{display:inline-block;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{40%{transform:translateY(-14px) scale(1.15)}}
.card{background:var(--card);border-radius:30px;padding:18px;text-align:center;box-shadow:0 8px 0 #0002;margin:10px 0}
.card h2{margin:6px 0;font-size:30px}.card p{font-size:22px;line-height:1.35;margin:8px 0}
.pic{font-size:96px;line-height:1.1;animation:bob 1.8s ease-in-out infinite;display:inline-block}
.big{display:block;width:100%;border:0;border-radius:30px;padding:18px;margin:12px 0;font:700 28px 'Fredoka','Chalkboard SE',system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 8px 0 #0004;transition:transform .1s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #0004}.big small{display:block;font-size:16px;opacity:.9}
.b1{background:var(--pink)}.b2{background:var(--blue)}.b3{background:var(--green)}.b4{background:var(--orange)}.b5{background:var(--purple)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row .big{margin:6px 0;font-size:24px}
.shelf{display:flex;justify-content:space-around;gap:6px}.shelf div{font-size:15px;text-align:center;flex:1}.shelf em{display:block;font-size:44px;font-style:normal}.lock{filter:grayscale(1) opacity(.35)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:clamp(36px,10vw,58px);height:clamp(48px,13vw,70px);border-radius:16px;border:4px dashed var(--pink);display:flex;align-items:center;justify-content:center;font:700 clamp(26px,7vw,40px) 'Fredoka',system-ui,sans-serif;background:var(--card);cursor:pointer}
.slot.f{border-style:solid;animation:pop .25s}.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:clamp(48px,13vw,68px);height:clamp(54px,14vw,76px);border:0;border-radius:18px;font:700 clamp(28px,8vw,42px) 'Fredoka',system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0004;animation:hop 2.4s ease-in-out infinite}
.tile:disabled{opacity:.2;box-shadow:none;animation:none}
@keyframes pop{50%{transform:scale(1.25)}}.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.cf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:99;pointer-events:none;animation:fall linear forwards;font-style:normal}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:100;background:var(--yellow);color:#4a2f00;border-radius:30px;padding:18px 26px;font-size:26px;font-weight:700;text-align:center;box-shadow:0 8px 0 #0004;animation:pop .6s}
.say{background:var(--yellow);color:#4a2f00;border:0;border-radius:24px;padding:10px 20px;font:700 22px 'Fredoka',system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 #0003}
.clue{font-size:22px}.fb{min-height:34px;font-size:24px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

function introWord(w){try{speechSynthesis.cancel()}catch(e){}spk(w.toLowerCase())}
function spellOut(w,done){try{speechSynthesis.cancel()}catch(e){}let k=0;const sl=()=>document.querySelectorAll('#sl .slot');const step=()=>{sl().forEach((s,j)=>s.style.outline=j==k?'5px solid #ffcf1f':'');if(k>=w.length){sl().forEach(s=>s.style.outline='');return spk(w.toLowerCase(),()=>setTimeout(done,600))}const c=w[k];spk(c+'.',()=>{k++;step()})};step()}
const sayThen=(t,f)=>{let d=0;const go=()=>{if(!d){d=1;setTimeout(f,500)}};try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=typeof VO!=='undefined'&&VO;if(v){u.voice=v;u.lang=v.lang}u.rate=v?.9:.8;u.pitch=v?1.05:1.3;u.onend=go;u.onerror=go;speechSynthesis.speak(u);setTimeout(go,10000)}catch(e){setTimeout(f,2500)}};
function confetti(n=70){for(let i=0;i<n;i++){const c=document.createElement('i');c.className='cf';if(Math.random()<.3){c.textContent='⭐';c.style.fontSize='18px'}else c.style.background=COL[i%6];c.style.cssText+=`;left:${Math.random()*100}vw;--x:${(Math.random()-.5)*220}px;animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.3}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const show=h=>{$('#s').innerHTML=h;hud();scrollTo(0,0)};
const prog=p=>$('#pg').style.width=p+'%';
function hud(){$('#hud').innerHTML=`<span>${'❤️'.repeat(S.hearts)}${'🤍'.repeat(3-S.hearts)}</span><span>⭐ ${S.pts}</span><span>🔥 ${S.streak}</span>`}
const mas=m=>`<div class="mas"><img src="${CHRIS}" alt="Grace, the learning buddy"><div class="bub">${m}</div></div>`;
const bounce=t=>[...t].map((c,i)=>`<span style="color:${COL[i%6]};animation-delay:${i*.08}s">${c==' '?'&nbsp;':c}</span>`).join('');
function add(n){S.pts+=n;hud();BADGES.forEach(b=>{if(S.pts>=b.p&&!S.got.includes(b.n)){S.got.push(b.n);const t=document.createElement('div');t.className='toast';t.innerHTML=`${b.e}<br>New reward!<br>${b.n}`;document.body.appendChild(t);confetti(130);beep([523,659,784,1047]);setTimeout(()=>t.remove(),2800)}})}
function win(base){S.streak++;add(base+Math.min(S.streak,5)*2);good();confetti(50)}
function lose(){S.streak=0;S.hearts--;bad();hud()}
function home(){try{speechSynthesis.cancel()}catch(e){}prog(0);show(`${mas("Hi! I'm Grace! Let's learn the parts of the body!")}<h1 class="title">${bounce('BODY PARTS')}</h1>
<button class="big b1" onclick="learn(0)">📖 Learn first<small>Head, arms, legs and more</small></button>
<div class="row"><button class="big b2" onclick="quiz()">🧠 Quiz time</button><button class="big b3" onclick="levels()">🔤 Spell it!</button></div><div class="row"><button class="big b4" onclick="mtch(0)">🧩 Body jobs</button><button class="big b5" onclick="mtch(1)">📍 Body places</button></div><button class="big b1" onclick="sortIt()">👍 True or false</button>
<div class="card"><b>My rewards</b><div class="shelf">${BADGES.map(b=>`<div class="${S.got.includes(b.n)?'':'lock'}"><em>${b.e}</em>${b.n}<br>${b.p} pts</div>`).join('')}</div></div>`)}
const L=[
['🤔','Big question','What if one of your body parts is missing or not working? Think, pair and share with a friend.',''],
['🔑','Key words','<b>Organ</b>: a special part inside your body that has an important job to help you live and stay healthy.<br><b>Body</b>: everything that makes you, like your head, arms, legs and everything inside you. Your body helps you move, play, eat, think and feel.<br><b>Parts</b>: the little pieces or sections that make up something bigger.',''],
['🧒','Head and face','Let us name the body parts! Your head has <b>hair</b>, two <b>eyes</b>, a <b>nose</b>, a <b>mouth</b> and two <b>ears</b>.',''],
['💪','Neck and arms','Your <b>neck</b> joins your head to your body. Your <b>shoulder</b> is at the top of your arm. You bend your arm at the <b>elbow</b>. At the end of your arm is your <b>hand</b> with five <b>fingers</b>.',''],
['👕','Body','Your <b>chest</b> is at the front of your body. Your <b>tummy</b>, or <b>stomach</b>, is below your chest. Your <b>hip</b> is at the side, where your leg joins your body.',''],
['🦵','Legs and feet','Your <b>leg</b> bends at the <b>knee</b>. At the end of your leg is your <b>foot</b>. You have five <b>toes</b> on each foot. Your legs and feet help you stand, walk and run!',''],
['🧠','Body parts have jobs','Eyes help us see. Ears help us hear. A nose helps us smell. A mouth helps us eat and talk. Hands help us hold things. Every body part is important!',''],
['🕵️','Body detective','Imagine someone cannot use one of their body parts, like their eyes, legs or hands. What problems might they face? What other body parts can help them instead?','']];
function learn(i){if(i>=L.length){say('Great learning! Now the quiz!');return quiz()}
const c=L[i];if(!S.seen[i]){S.seen[i]=1;add(5)}prog((i+1)/L.length*100);
show(`${mas(i?'Look and listen!':'Let us learn together!')}<div class="card"><div class="pic">${c[0]}</div><h2>${c[1]}</h2><p>${c[2]}</p><button class="say" onclick="readL(${i})">🔊 Read aloud</button> <button class="say" onclick="readL(${i})">🔁 Read again</button> ${c[3]?`<button class="say" onclick="say(L[${i}][3])">🔈 Hear the sound</button>`:''}</div>
<button class="big b${i%5+1}" onclick="beep([660,880]);learn(${i+1})">${i==L.length-1?'🚀 Start the quiz!':'Next ➜'}</button>`);readL(i)}
const Q=[
['Which body part do we use to see?',['Eyes','Ears','Nose','Knee'],0,'👀'],
['Where does your arm bend?',['Elbow','Knee','Toe','Ear'],0,'💪'],
['Where does your leg bend?',['Knee','Elbow','Finger','Chin'],0,'🦵'],
['How many fingers are on one hand?',['Five','Three','Seven','Ten'],0,'🖐️'],
['Which body parts do you find on your foot?',['Toes','Fingers','Hair','Nose'],0,'🦶'],
['What is an organ?',['A special part inside your body with an important job','A part of a car','A kind of food','A toy'],0,'🫀'],
['What does your body help you do?',['Move, play, eat, think and feel','Only sleep','Only sit','Nothing'],0,'🏃'],
['Which body part helps us hear?',['Ears','Eyes','Nose','Hands'],0,'👂']];
let qi=0;
function quiz(){qi=0;S.hearts=3;ask()}
function ask(){if(qi>=Q.length)return fin('Quiz star!','Now spell the words!','levels()');
const q=Q[qi],o=shuf(q[1].map((t,i)=>[t,i==q[2]]));prog(qi/Q.length*100);window.O=o;window.CQ=q;
show(`${mas('Super detective time! Pick the right one.')}<div class="card"><div class="pic">${q[3]}</div><h2>${q[0]}</h2><button class="say" onclick="sayQ(1)">🔊 Read question</button> <button class="say" onclick="sayQ(2)">🔊 Read answers</button> <button class="say" onclick="sayQ(0)">🔁 Read all again</button></div><div id="o">${o.map((x,i)=>`<div style="display:flex;gap:8px;align-items:center"><button class="big b${i+1}" style="flex:1" onclick="pick(${i})">${'ABCD'[i]}. ${x[0]}</button><button class="say" onclick="say('${'ABCD'[i]}. '+O[${i}][0])">🔊</button></div>`).join('')}</div><div class="fb card" id="fb"></div>`);sayQ(0)}
function pick(i){const bs=document.querySelectorAll('#o button');bs.forEach(b=>b.disabled=true);const ok=O[i][1];
if(ok){win(10);$('#fb').textContent='🎉 Yes! +'+(10+Math.min(S.streak,5)*2)+' points';window.MSG='Correct! The answer is '+CQ[1][CQ[2]]+'.'}
else{lose();bs[i].classList.add('shake');bs[i].style.opacity=.4;bs[O.findIndex(x=>x[1])].style.outline='6px solid #fff';$('#fb').textContent='Oops! The correct answer is '+CQ[1][CQ[2]]+'.';window.MSG='Oops! The correct answer is '+CQ[1][CQ[2]]+'.'}
sayThen(MSG,()=>{if(S.hearts<=0)return over();qi++;ask()})}
function over(){prog(0);S.hearts=3;show(`${mas("Oh no, no hearts left! You are learning so well. Let's try again!")}<div class="card"><div class="pic">💪</div><h2>Keep going!</h2></div><button class="big b1" onclick="learn(0)">📖 Learn again</button><button class="big b2" onclick="home()">🏠 Home</button>`)}
function fin(t,sub,go){prog(100);confetti(150);beep([523,659,784,1047]);say(t);show(`${mas('Hooray! You did it!')}<div class="card"><div class="pic">🏆</div><h2>${t}</h2><p>You have <b>${S.pts}</b> points!</p></div><button class="big b3" onclick="${go}">${sub}</button><button class="big b4" onclick="home()">🏠 Home</button>`)}
const W={1:[['EAR','👂','I help you hear sounds.'],['EYE','👁️','I help you see.'],['LEG','🦵','I help you walk and run. I bend at the knee.'],['ARM','💪','I have an elbow and a hand at the end of me.']],
2:[['NOSE','👃','I help you smell things.'],['MOUTH','👄','I help you eat and talk.'],['HAND','✋','I have five fingers.'],['FOOT','🦶','I have five toes. You stand on me.']],
3:[['SHOULDER','🤷','I am at the top of your arm.'],['STOMACH','🍽️','I am below your chest. Food goes in me.'],['ELBOW','💪','Your arm bends at me.'],['FINGER','☝️','You have five of us on each hand.']]};
function levels(){prog(0);show(`${mas('Pick a level and spell the word!')}<button class="big b3" onclick="spell(1,0)">🌱 Easy<small>Short words, +15 points</small></button><button class="big b4" onclick="spell(2,0)">🌟 Medium<small>One sneaky extra letter, +25 points</small></button><button class="big b1" onclick="spell(3,0)">🚀 Hard<small>Two sneaky letters, +35 points</small></button><button class="big b2" onclick="home()">🏠 Home</button>`)}
let C;
function spell(lv,i){if(!i)S.hearts=3;const ws=W[lv];if(i>=ws.length)return fin('Level '+lv+' complete!',lv<3?'Next level ➜':'🏠 Home',lv<3?`spell(${lv+1},0)`:'home()');
const w=ws[i],A='AEIOSTRNLMPDCBGHKU';let L2=[...w[0]];for(let k=0;k<lv-1;k++)L2.push(A[Math.floor(Math.random()*A.length)]);
C={lv,i,w:w[0],slots:Array(w[0].length).fill(null),t:shuf(L2).map(c=>({c,u:0})),lock:0};prog(i/ws.length*100);
show(`${mas('Say it loud, then spell it!')}<div class="card"><div class="pic">${w[1]}</div><p class="clue">${w[2]}</p><button class="say" onclick="introWord('${w[0]}')">🔊 Read again</button><div class="slots" id="sl"></div><div class="fb" id="fb"></div></div><div class="tiles" id="ti"></div>`);introWord(w[0]);draw()}
function draw(){$('#sl').innerHTML=C.slots.map((x,j)=>`<div class="slot ${x!=null?'f':''}" onclick="unp(${j})" style="color:${COL[j%6]}">${x!=null?C.t[x].c:''}</div>`).join('');
$('#ti').innerHTML=C.t.map((t,k)=>`<button class="tile" ${t.u?'disabled':''} style="background:${COL[k%6]};animation-delay:${k*.15}s" onclick="tap(${k})">${t.c}</button>`).join('')}
function tap(k){if(C.lock||C.t[k].u)return;const j=C.slots.indexOf(null);if(j<0)return;C.slots[j]=k;C.t[k].u=1;draw();const c=C.t[k].c;say(c+'.');if(C.slots.indexOf(null)<0)chk()}
function unp(j){if(C.lock||C.slots[j]==null)return;C.t[C.slots[j]].u=0;C.slots[j]=null;draw()}
function chk(){C.lock=1;const g=C.slots.map(k=>C.t[k].c).join('');
if(g==C.w){win(10+C.lv*5);$('#fb').textContent='🌟 Amazing! '+C.w+'!';spellOut(C.w,()=>spell(C.lv,C.i+1))}
else{lose();$('#sl').classList.add('shake');$('#fb').textContent='Not quite. Try again!';if(S.hearts<=0)return setTimeout(over,1200);
setTimeout(()=>{C.slots.fill(null);C.t.forEach(t=>t.u=0);C.lock=0;$('#sl').classList.remove('shake');$('#fb').textContent='';draw()},900)}}
const txt=h=>{const d=document.createElement('div');d.innerHTML=h.replace(/<br>/g,'. ');return d.textContent};
const readL=i=>say(L[i][1]+'. '+txt(L[i][2]));
const sayQ=m=>{const q=CQ,a=O.map((x,i)=>'ABCD'[i]+'. '+x[0]).join('. ');say(m==1?q[0]:m==2?'The answers are. '+a:q[0]+' The answers are. '+a)};
const MG=[{t:'Match the body part to its job',p:[['Eyes help us','👀<br>See'],['Ears help us','👂<br>Hear'],['A nose helps us','👃<br>Smell'],['A mouth helps us','👄<br>Eat and talk']],say:'Tap the start of a sentence, then tap the ending that goes with it.'},{t:'Match the body part to where it is',p:[['Your elbow is on your','💪<br>Arm'],['Your knee is on your','🦵<br>Leg'],['Your toes are on your','🦶<br>Foot'],['Your fingers are on your','✋<br>Hand']],say:'Tap the start of a sentence, then tap the ending that completes it.'}];
let M,T;
function mtch(g){S.hearts=3;const d=MG[g];M={d,sel:null,ok:[],r:shuf(d.p.map((x,i)=>i))};prog(0);show(`${mas(d.say)}<div class="card"><h2>${d.t}</h2><button class="say" onclick="say(M.d.say)">🔊 Read again</button></div><div class="row"><div id="ml"></div><div id="mr"></div></div><div class="fb card" id="fb"></div>`);say(d.t+'. '+d.say);mdraw()}
function mdraw(){const m=M;$('#ml').innerHTML=m.d.p.map((x,i)=>{const st=(m.ok.includes(i)?'opacity:.3;':'')+(m.sel===i?'outline:6px solid #fff;':'')+'font-size:20px';return `<button class="big b${i%5+1}" style="${st}" onclick="msel(${i})">${x[0]}</button>`}).join('');
$('#mr').innerHTML=m.r.map(i=>`<button class="big" style="background:var(--card);color:var(--ink);font-size:30px;padding:8px;${m.ok.includes(i)?'opacity:.3':''}" onclick="mpick(${i})">${m.d.p[i][1]}</button>`).join('')}
function msel(i){if(M.ok.includes(i))return;M.sel=i;mdraw();const m=M,p=m.d.p,t=++RT,rs=[...document.querySelectorAll('#mr button')];let k=0;try{speechSynthesis.cancel()}catch(e){}
const step=()=>{rs.forEach(b=>b.style.outline='');if(t!==RT||k>=rs.length)return;const j=m.r[k];if(m.ok.includes(j)||!(p[j][2]||p[j][1].includes('<br>'))){k++;return step()}rs[k].style.outline='6px solid #ffcf1f';spk(lb(p[j]),()=>{k++;step()})};
spk(p[i][2]||p[i][0],step)}
function mpick(i){RT++;document.querySelectorAll('#mr button').forEach(b=>b.style.outline='');if(M.sel==null){$('#fb').textContent='Tap a word first!';say('Tap a word first');return}if(M.ok.includes(i))return;
if(i==M.sel){M.ok.push(i);win(10);const n=M.d.p[i][1].includes('<br>')?M.d.p[i][0]+' '+lb(M.d.p[i]).toLowerCase()+'.':M.d.p[i][0];M.sel=null;$('#fb').textContent='🎉 Yes! '+n;say('Yes! '+n);prog(M.ok.length/M.d.p.length*100);mdraw();if(M.ok.length==M.d.p.length)setTimeout(()=>fin('Match master!','🏠 Home','home()'),1300)}
else{lose();$('#fb').textContent='Oops, try another picture!';say('Oops, try another one');if(S.hearts<=0)setTimeout(over,1200)}}
const SI=[['Your eyes help you see.',1],['You hear with your nose.',0],['Your knee is on your leg.',1],['Your elbow is on your foot.',0],['Your mouth helps you eat and talk.',1],['Your fingers are on your foot.',0]];
function sortIt(){S.hearts=3;T={i:0,l:shuf(SI)};tq()}
function tq(){if(T.i>=T.l.length)return fin('True or false champion!','🏠 Home','home()');const x=T.l[T.i];prog(T.i/T.l.length*100);T.q='True or false? '+x[0];
show(`${mas('Thumbs up or thumbs down?')}<div class="card"><div class="pic">🤔</div><h2>${x[0]}</h2><button class="say" onclick="say(T.q)">🔊 Read again</button></div><button class="big b3" onclick="sk(1)">👍 True</button><button class="big b1" onclick="sk(0)">👎 False</button><div class="fb card" id="fb"></div>`);say(T.q)}
function sk(a){const x=T.l[T.i];if(a==x[1]){win(10);const ans=x[1]?'True':'False';$('#fb').textContent='🎉 Yes, the answer is '+ans+'!';T.i++;sayThen('Yes, the answer is '+ans+'.',tq)}else{lose();$('#fb').textContent='Oops, think again!';say('Oops, think again');if(S.hearts<=0)setTimeout(over,1200)}}
function intro(){prog(0);window.INTRO='Welcome to Tippie Toe! Hi, I am Grace. Today we will learn the parts of the body. We will name our eyes, ears, hands, knees and more, and play games to win stars and rewards!';
show(`<div class="card"><img src="${document.querySelector('.logo').src}" alt="Tippie Toe logo" style="height:96px;border-radius:22px"><h1 class="title" style="font-size:clamp(28px,8vw,48px);margin-top:10px">${bounce('WELCOME TO TIPPIE TOE!')}</h1></div>${mas('Hi, I am Grace! I am so happy to see you!')}<div class="card"><h2>Today we will learn</h2><div class="row" style="font-size:26px"><div>👀 <b>Head and face</b></div><div>💪 <b>Arms and hands</b></div><div>🦵 <b>Legs and feet</b></div><div>🧩 <b>Games</b></div></div><p>We will listen, spell, match and play games to win stars and rewards!</p><button class="say" onclick="say(INTRO)">🔊 Hear Grace</button> <button class="say" onclick="say(INTRO)">🔁 Read again</button></div><button class="big b3" onclick="beep([660,880]);home()">🚀 Let us start!</button>`);say(INTRO);confetti(60)}
intro();
</script></body></html>
